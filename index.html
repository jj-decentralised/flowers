<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Living Vases</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Astronomy Engine from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>

  <!-- html2canvas for image export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p id="loading-message">Gathering flowers...</p>
  </div>

  <div id="app">

    <!-- The Arrangement (top) -->
    <section id="canvas-section">
      <div id="arrangement-container"></div>
    </section>

    <!-- Thin separator -->
    <div class="separator"></div>

    <!-- Bird of the Day -->
    <section id="bird-section" class="content-section">
      <p class="section-label">Today's bird</p>
      <h2 id="bird-name"></h2>
      <p id="bird-scientific" class="scientific-name"></p>
      <p id="bird-description" class="bird-note"></p>
      <button id="bird-play-btn" class="play-btn" aria-label="Play bird song">
        <span class="play-icon"></span>
      </button>
    </section>

    <!-- Thin separator -->
    <div class="separator"></div>

    <!-- Love Poem -->
    <section id="poem-section" class="content-section">
      <blockquote id="poem-lines"></blockquote>
      <cite id="poem-attribution"></cite>
    </section>

    <!-- Thin separator -->
    <div class="separator"></div>

    <!-- Arrangement Details (collapsed by default) -->
    <section id="details-section" class="content-section">
      <button id="details-toggle" class="toggle-btn">Details</button>
      <div id="details-body" class="details-body hidden">

        <!-- Birthday Input -->
        <div class="detail-group">
          <label for="birthday-input" class="detail-label">A lover's birthday</label>
          <input type="date" id="birthday-input" value="1995-11-04" />
        </div>

        <div class="detail-group">
          <p class="detail-label">Weather in Singapore</p>
          <p id="weather-details" class="detail-value">--</p>
        </div>

        <div class="detail-group">
          <p class="detail-label">Celestial portrait</p>
          <p id="astronomy-details" class="detail-value">--</p>
        </div>

        <div class="detail-group">
          <p class="detail-label">The vessel</p>
          <p id="museum-details" class="detail-value">--</p>
        </div>

        <div class="detail-group">
          <p class="detail-label">The bouquet</p>
          <ul id="flora-list"></ul>
        </div>

        <button id="generate-btn" class="btn-generate">Arrange again</button>
        <button id="download-btn" class="btn-download">Save as image</button>
      </div>
    </section>

    <!-- Receipt (hidden until generated) -->
    <div id="receipt" class="receipt hidden">
      <div id="receipt-content"></div>
    </div>

  </div>

  <!-- Application JS — loaded in dependency order -->
  <script src="js/floraDatabase.js"></script>
  <script src="js/museumApi.js"></script>
  <script src="js/weatherApi.js"></script>
  <script src="js/astronomyEngine.js"></script>
  <script src="js/symbolismEngine.js"></script>
  <script src="js/imageProcessor.js"></script>
  <script src="js/flowerImageApi.js"></script>
  <script src="js/compositionEngine.js"></script>
  <script src="js/birdSongs.js"></script>
  <script src="js/lovePoems.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
