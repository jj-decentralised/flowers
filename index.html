<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Living Vases</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Fabric.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <!-- Astronomy Engine from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <p id="loading-message">Gathering flowers...</p>
    </div>

    <!-- Header -->
    <header id="header">
      <h1>The Living Vases</h1>
      <p class="subtitle">Real-time floral compositions drawn from weather, stars, and art history</p>
    </header>

    <!-- Main canvas area -->
    <main id="canvas-container">
      <canvas id="main-canvas" width="800" height="1000"></canvas>
    </main>

    <!-- Controls / info panel -->
    <aside id="info-panel">

      <!-- Birthday Input -->
      <div class="info-block birthday-block">
        <h3>A Lover's Birthday</h3>
        <p class="input-hint">Tell me when they were born&hellip;</p>
        <input type="date" id="birthday-input" value="1995-11-04" />
      </div>

      <div id="data-sources">
        <h2>Current Conditions</h2>
        <div id="weather-info" class="info-block">
          <h3>Weather</h3>
          <p id="weather-details">--</p>
        </div>
        <div id="astronomy-info" class="info-block">
          <h3>Astronomy</h3>
          <p id="astronomy-details">--</p>
        </div>
        <div id="museum-info" class="info-block">
          <h3>Museum Artwork</h3>
          <p id="museum-details">--</p>
        </div>
      </div>

      <div id="composition-info">
        <h2>Composition</h2>
        <ul id="flora-list"></ul>
      </div>

      <button id="generate-btn" class="btn-primary">Generate New Arrangement</button>

      <!-- Receipt / export area -->
      <div id="receipt" class="receipt hidden">
        <h2>Arrangement Receipt</h2>
        <div id="receipt-content"></div>
        <button id="download-btn" class="btn-secondary">Download Image</button>
      </div>
    </aside>

  </div>

  <!-- Application JS — loaded in dependency order -->
  <script src="js/floraDatabase.js"></script>
  <script src="js/museumApi.js"></script>
  <script src="js/weatherApi.js"></script>
  <script src="js/astronomyEngine.js"></script>
  <script src="js/symbolismEngine.js"></script>
  <script src="js/imageProcessor.js"></script>
  <script src="js/compositionEngine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
