<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Vyshnavi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 18px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      background-color: #faf8f5;
      color: #2c2420;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      will-change: transform, opacity;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      max-width: 420px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .bouquet {
      width: min(360px, 100%);
      min-height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.5s ease 0.3s forwards, float 6s ease-in-out 2s infinite;
    }

    .bouquet img {
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      border-radius: 2px;
      filter: drop-shadow(0 8px 24px rgba(44, 36, 32, 0.08));
    }

    .bouquet-loading {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 300;
      color: #b8a99e;
      text-align: center;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .bouquet-error {
      font-size: 0.9rem;
      color: #8b6f5e;
      text-align: center;
      line-height: 1.65;
      padding: 1.5rem 1rem;
      max-width: 280px;
    }

    .flower-caption {
      max-width: 340px;
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      font-style: italic;
      font-weight: 300;
      line-height: 1.65;
      color: #9a8578;
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }

    .flower-caption .influence {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b8a99e;
      font-style: normal;
    }

    .flower-caption.birthday {
      color: #a08058;
    }

    .flower-caption.birthday .influence {
      color: #c4a060;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @media (max-width: 540px) {
      .page { padding: 2rem 1.25rem; }
      .bouquet { min-height: 360px; }
      html { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div id="petals-container"></div>

  <main class="page">
    <div class="bouquet" id="bouquet" aria-label="Today's flower for Vyshnavi">
      <p class="bouquet-loading">Painting today's flower&hellip;</p>
    </div>

    <p class="flower-caption" id="flower-caption">
      Composing from the sky above Singapore&hellip;
    </p>
  </main>

  <script>
    (function () {
      'use strict';

      var PETAL_COLORS = ['#d4917e', '#d4a0a0', '#c9a0a8', '#ddb8a0', '#c8b0c0', '#e8c8a0'];

      function setCaption(caption) {
        var el = document.getElementById('flower-caption');
        el.classList.toggle('birthday', caption.isBirthday);
        el.innerHTML = caption.main + '<span class="influence">' + caption.influence + '</span>';
      }

      function showFlower(imageUrl) {
        var bouquet = document.getElementById('bouquet');
        bouquet.innerHTML = '';
        var img = document.createElement('img');
        img.src = imageUrl;
        img.alt = "Today's flower for Vyshnavi";
        img.loading = 'eager';
        bouquet.appendChild(img);
      }

      function showError(message, hint) {
        var bouquet = document.getElementById('bouquet');
        bouquet.innerHTML = '<p class="bouquet-error">' + message +
          (hint ? '<br><br><span style="font-size:0.85rem;color:#b8a99e">' + hint + '</span>' : '') +
          '</p>';
      }

      function startPetals() {
        var container = document.getElementById('petals-container');

        function createPetal() {
          var petal = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          petal.classList.add('petal');
          petal.setAttribute('width', '14');
          petal.setAttribute('height', '14');
          petal.setAttribute('viewBox', '0 0 14 14');

          var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M 7 0 Q 12 4 12 8 Q 12 12 7 14 Q 2 12 2 8 Q 2 4 7 0');
          path.setAttribute('fill', PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)]);
          path.setAttribute('opacity', '0.6');
          petal.appendChild(path);

          var size = 8 + Math.random() * 10;
          petal.style.width = size + 'px';
          petal.style.height = size + 'px';
          petal.style.left = Math.random() * 100 + 'vw';
          petal.style.top = '-20px';
          container.appendChild(petal);

          var duration = 8000 + Math.random() * 7000;
          var swayAmount = 60 + Math.random() * 80;
          var startRotation = Math.random() * 360;
          var startTime = performance.now();

          function animatePetal(now) {
            var elapsed = now - startTime;
            var progress = elapsed / duration;
            if (progress > 1) {
              container.removeChild(petal);
              return;
            }
            var y = -20 + progress * (window.innerHeight + 40);
            var x = Math.sin(progress * Math.PI * 2.5) * swayAmount;
            var rotation = startRotation + progress * 180;
            var opacity = progress < 0.1 ? progress * 10 : progress > 0.85 ? (1 - progress) / 0.15 : 1;
            opacity *= 0.4;
            petal.style.opacity = opacity;
            petal.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rotation + 'deg)';
            requestAnimationFrame(animatePetal);
          }

          requestAnimationFrame(animatePetal);
        }

        function spawnLoop() {
          createPetal();
          setTimeout(spawnLoop, 2000 + Math.random() * 3000);
        }

        setTimeout(spawnLoop, 1500);
      }

      fetch('/api/flower')
        .then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error(data.error || 'Flower generation failed');
            return data;
          });
        })
        .then(function (data) {
          showFlower(data.imageUrl);
          setCaption(data.caption);
          startPetals();
        })
        .catch(function (err) {
          showError('The flower could not be painted just now.', err.message);
          document.getElementById('flower-caption').textContent =
            'Check that RECRAFT_API_KEY is set on the server.';
          startPetals();
        });
    })();
  </script>
</body>
</html>
